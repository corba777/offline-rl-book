name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    name: Unit tests and chapter scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s code -p 'test_*.py' -v
      - name: Run every chapter script with quick settings
        run: python scripts/run_examples.py

  html:
    name: Chapter HTML is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Exact versions: other versions change the markup, not the content.
      - run: pip install markdown==3.11.3 Pygments==2.21.0 PyYAML==6.0.3
      - run: python scripts/md2html.py
      - name: Fail if any HTML differs from its Markdown source
        run: |
          if [ -n "$(git status --porcelain -- '*.html')" ]; then
            git status --short -- '*.html'
            echo "::error::HTML is stale. Run 'python scripts/md2html.py' and commit the result."
            exit 1
          fi

  pdf:
    name: PDF of the English edition
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # to update the "pdf" release on main
    steps:
      - uses: actions/checkout@v5
      - name: Install pandoc, tectonic and rsvg-convert
        run: |
          curl -fsSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.13/pandoc-3.13-1-amd64.deb
          sudo apt-get install -y ./pandoc.deb librsvg2-bin
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin
          pandoc --version | head -1 && tectonic --version
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ hashFiles('scripts/pdf/*.tex') }}
          restore-keys: tectonic-
      - run: python3 scripts/build_pdf.py
      - uses: actions/upload-artifact@v7
        with:
          name: offline-rl-book-pdf
          path: |
            build/pdf/offline-rl-book.pdf
            build/pdf/offline-rl-book.tex
            build/pdf/preamble.tex
            build/pdf/title.tex
            build/pdf/figures/
      # A fixed release gives the site a permanent link to the latest PDF:
      # https://github.com/corba777/offline-rl-book/releases/download/pdf/offline-rl-book.pdf
      - name: Publish the PDF to the "pdf" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Latest PDF of the English edition, rebuilt by CI on every push to main. Built from ${GITHUB_SHA::7}."
          if ! gh release view pdf >/dev/null 2>&1; then
            gh release create pdf --title "PDF (latest build)" --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release edit pdf --notes "$notes"
          fi
          gh release upload pdf build/pdf/offline-rl-book.pdf --clobber
