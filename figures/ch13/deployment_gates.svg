<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4441b"/></marker>
  </defs>
  <rect width="780" height="300" fill="#ffffff"/>

  <!-- authority row -->
  <g font-size="12" fill="#555570" text-anchor="middle">
    <text x="105" y="30">authority: none</text>
    <text x="295" y="30">authority: none</text>
    <text x="485" y="30">advises only</text>
    <text x="675" y="30">bounded control</text>
  </g>

  <!-- gates; fill deepens with authority -->
  <rect x="20" y="42" width="170" height="92" rx="10" fill="#f4f4f0" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="105" y="68" text-anchor="middle" font-weight="600">Gate 1</text>
  <text x="105" y="88" text-anchor="middle">Data and support</text>
  <text x="105" y="108" text-anchor="middle" fill="#555570" font-size="12">coverage, BC, first OPE</text>

  <rect x="210" y="42" width="170" height="92" rx="10" fill="#eef2fc" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="295" y="68" text-anchor="middle" font-weight="600">Gate 2</text>
  <text x="295" y="88" text-anchor="middle">Offline evaluation</text>
  <text x="295" y="108" text-anchor="middle" fill="#555570" font-size="12">OPE agreement, constraints</text>

  <rect x="400" y="42" width="170" height="92" rx="10" fill="#dbe6fb" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="485" y="68" text-anchor="middle" font-weight="600">Gate 3</text>
  <text x="485" y="88" text-anchor="middle">Shadow mode</text>
  <text x="485" y="108" text-anchor="middle" fill="#555570" font-size="12">logs actions, no actuation</text>

  <rect x="590" y="42" width="170" height="92" rx="10" fill="#bcd1f7" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="675" y="68" text-anchor="middle" font-weight="600">Gate 4</text>
  <text x="675" y="88" text-anchor="middle">Limited rollout</text>
  <text x="675" y="108" text-anchor="middle" fill="#555570" font-size="12">caps, monitoring, approval</text>

  <line x1="190" y1="88" x2="206" y2="88" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="88" x2="396" y2="88" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="570" y1="88" x2="586" y2="88" stroke="#1a1a2e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- stop / fallback -->
  <g font-size="12" fill="#b4441b" text-anchor="middle">
    <line x1="105" y1="134" x2="105" y2="166" stroke="#b4441b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
    <line x1="295" y1="134" x2="295" y2="166" stroke="#b4441b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
    <line x1="485" y1="134" x2="485" y2="166" stroke="#b4441b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
    <line x1="675" y1="134" x2="675" y2="166" stroke="#b4441b" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
    <text x="105" y="186">stop: stay on BC + rules,</text>
    <text x="105" y="201">MPC or operators</text>
    <text x="295" y="186">stop: behavior policy</text>
    <text x="295" y="201">or BC stays in control</text>
    <text x="485" y="186">stop: current controller</text>
    <text x="485" y="201">stays in the loop</text>
    <text x="675" y="186">alarm: automatic revert</text>
    <text x="675" y="201">to BC, MPC or manual</text>
  </g>

  <!-- authority arrow -->
  <line x1="20" y1="244" x2="756" y2="244" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
  <text x="20" y="266" fill="#2563eb" font-size="12">the policy's authority over the plant grows only after each gate passes</text>
  <text x="20" y="286" fill="#555570" font-size="12">Thresholds come from process risk: equipment damage, product quality, regulation and reversibility.</text>
</svg>
