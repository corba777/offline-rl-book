<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="920" height="230" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="0" y="0" width="920" height="230" rx="14" fill="#f6f6f2"/>

  <!-- Title block -->
  <text x="44" y="92" font-size="44" font-weight="700" fill="#1a1a2e">Offline RL</text>
  <text x="46" y="128" font-size="21" fill="#1a1a2e">From Theory to Industrial Practice</text>
  <text x="46" y="168" font-size="14.5" fill="#55556a">Learning control policies from logged data —</text>
  <text x="46" y="189" font-size="14.5" fill="#55556a">without live experiments on the plant.</text>

  <!-- Motif: values inside and outside the data -->
  <g transform="translate(520,34)">
    <rect x="118" y="0" width="104" height="162" fill="#e6e6df"/>
    <text x="170" y="16" font-size="11" text-anchor="middle" fill="#55556a">logged actions</text>
    <!-- naive estimate: optimistic away from data -->
    <path d="M0,30 C60,38 110,46 170,46 C230,46 280,38 340,26" fill="none" stroke="#b4441b" stroke-width="3"/>
    <!-- true value -->
    <path d="M0,100 L340,100" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-dasharray="7 5"/>
    <!-- conservative estimate: below the truth outside the data -->
    <path d="M0,160 C70,140 120,104 170,98 C220,104 270,140 340,158" fill="none" stroke="#2563eb" stroke-width="3"/>
    <line x1="0" y1="162" x2="340" y2="162" stroke="#1a1a2e" stroke-width="1.2"/>
    <text x="344" y="30" font-size="11.5" fill="#b4441b">naive</text>
    <text x="344" y="104" font-size="11.5" fill="#1a1a2e">true</text>
    <text x="344" y="160" font-size="11.5" fill="#2563eb">CQL</text>
    <text x="170" y="182" font-size="11.5" text-anchor="middle" fill="#55556a">action</text>
  </g>
</svg>
